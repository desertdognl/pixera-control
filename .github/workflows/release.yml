name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: release/Pixera-Control-*-mac-*.zip

  build-win:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            release/Pixera-Control-*-win-*.exe
            release/Pixera-Control-*-win-*.zip

  publish:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir -p dist-upload
          find artifacts -type f \( -name '*.zip' -o -name '*.exe' \) -exec cp {} dist-upload/ \;
          ls -la dist-upload
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="$(mktemp)"
          {
            echo "Pixera Control \`${TAG}\`"
            echo ""
            echo "### Downloads"
            echo "- **macOS (Apple Silicon):** \`Pixera-Control-*-mac-arm64.zip\`"
            echo "- **Windows:** \`Pixera-Control-*-win-x64.exe\` (installer) or \`.zip\` (portable)"
            echo ""
            echo "See the README for first-open steps (Gatekeeper / SmartScreen)."
            echo ""
            PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
              PREV_VER="${PREV_TAG#v}"
              echo "### Updates since ${PREV_TAG}"
              echo ""
              awk -v prev="$PREV_VER" '
                $0 ~ "^## " prev " " { exit }
                $0 ~ /^## [0-9]+\.[0-9]+\.[0-9]+ / { if (!started) started=1; print; next }
                started { print }
              ' CHANGELOG.md
              echo ""
            fi
            echo "### ${TAG#v}"
            awk -v ver="${TAG#v}" '
              $0 ~ "^## " ver " " {p=1; next}
              p && /^## / {exit}
              p {print}
            ' CHANGELOG.md
          } > "$NOTES_FILE"
          gh release create "$TAG" dist-upload/* \
            --title "Pixera Control ${TAG}" \
            --notes-file "$NOTES_FILE"
